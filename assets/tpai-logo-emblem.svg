<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@900&amp;display=swap');
    </style>
    <linearGradient id="wT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/><stop offset="40%" stop-color="#00D2FF"/><stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="bB" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#07153B"/><stop offset="50%" stop-color="#0D2B8A"/><stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
    <linearGradient id="lP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/><stop offset="50%" stop-color="#0284C7"/><stop offset="100%" stop-color="#0D2B8A"/>
    </linearGradient>
    <linearGradient id="lA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/><stop offset="50%" stop-color="#0284C7"/><stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="sI" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/><stop offset="40%" stop-color="#00D2FF"/><stop offset="100%" stop-color="#0D2B8A"/>
    </linearGradient>
    <linearGradient id="stAmb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/><stop offset="30%" stop-color="#FDE68A"/><stop offset="70%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="cresCy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/><stop offset="50%" stop-color="#00D2FF"/><stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glowM" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b1"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Crescent Orbit Swoosh -->
  <path d="M 108,232 
           C 67,344 144,424 256,428 
           C 360,432 435,376 456,300 
           C 408,344 339,380 256,380 
           C 168,380 108,316 131,236 Z" 
        fill="url(#cresCy)"/>

  <!-- Golden accent ray -->
  <path d="M 160,396 C 232,428 352,416 412,355" 
        stroke="#F59E0B" stroke-width="2.8" stroke-linecap="round" opacity="0.85"/>

  <!-- 5 Quantum Stars -->
  <g filter="url(#glowM)">
    <polygon points="100,201 105,188 113,201 100,193 113,193" fill="#FDE68A" transform="scale(1.2) translate(-8, -12)"/>
    <polygon points="131,153 136,140 144,153 131,145 144,145" fill="#FDE68A" transform="scale(1.3) translate(-14, -8)"/>
    <polygon points="179,108 184,92 193,108 177,98 193,98" fill="#F59E0B" transform="scale(1.4) translate(-22, -4)"/>
    <polygon points="236,76 241,59 252,76 235,65 254,65" fill="#F59E0B" transform="scale(1.5) translate(-32, 0)"/>
    <!-- Star 5 Pinnacle Sun -->
    <g transform="translate(313, 67)">
      <circle cx="0" cy="0" r="9.5" fill="url(#stAmb)"/>
      <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
      <line x1="0" y1="-17" x2="0" y2="17" stroke="#FDE68A" stroke-width="2.4"/>
      <line x1="-17" y1="0" x2="17" y2="0" stroke="#FDE68A" stroke-width="2.4"/>
      <line x1="-12" y1="-12" x2="12" y2="12" stroke="#FDE68A" stroke-width="2"/>
      <line x1="12" y1="-12" x2="-12" y2="12" stroke="#FDE68A" stroke-width="2"/>
    </g>
  </g>

  <!-- 3D Monogram Icon -->
  <g transform="translate(256, 227) scale(0.61) rotate(-3)">
    <path d="M -160,-105 L 145,-105 L 120,-55 L -130,-55 Z" fill="url(#wT)"/>
    <polygon points="-160,-105 -130,-55 -145,-55" fill="#0369A1"/>
    <line x1="-155" y1="-103" x2="140" y2="-103" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
    <path d="M -125,145 L -70,145 L -10,-45 L -55,-45 Z" fill="url(#lA)"/>
    <path d="M -80,45 L 20,45 L 10,75 L -70,75 Z" fill="url(#bB)"/>
    <path d="M -22,-55 L 22,-55 L 22,145 L -22,145 Z" fill="url(#sI)"/>
    <line x1="0" y1="-50" x2="0" y2="140" stroke="#FFFFFF" stroke-width="2.5" opacity="0.7"/>
    <path d="M 0,-55 L 75,-55 C 145,-55 160,15 105,52 C 75,72 25,72 0,72 L 0,30 C 18,30 55,30 75,18 C 105,-2 92,-25 45,-25 L 0,-25 Z" fill="url(#lP)"/>
    <path d="M 0,-55 L 45,-25 L 0,-25 Z" fill="#07153B" opacity="0.4"/>
    <g transform="translate(0, -105)" filter="url(#glowM)">
      <polygon points="0,-22 16,0 0,22 -16,0" fill="url(#stAmb)"/>
      <polygon points="0,-12 9,0 0,12 -9,0" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
      <line x1="-36" y1="0" x2="36" y2="0" stroke="#FDE68A" stroke-width="2.5" opacity="0.9"/>
      <line x1="0" y1="-36" x2="0" y2="36" stroke="#FDE68A" stroke-width="2.5" opacity="0.9"/>
    </g>
    <polygon points="0,145 22,145 0,175 -22,145" fill="url(#wT)"/>
  </g>

  <!-- TPAI Wordmark at bottom -->
  <text x="256" y="475" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="54" font-weight="900" letter-spacing="6px">
    <tspan fill="#FFFFFF">TP</tspan><tspan fill="#00D2FF">AI</tspan>
  </text>
</svg>