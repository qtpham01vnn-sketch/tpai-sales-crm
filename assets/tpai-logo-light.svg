<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 110" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800;900&amp;display=swap');
    </style>
    <linearGradient id="wH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/><stop offset="40%" stop-color="#00D2FF"/><stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="bH" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#07153B"/><stop offset="50%" stop-color="#0D2B8A"/><stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
    <linearGradient id="lH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/><stop offset="50%" stop-color="#0284C7"/><stop offset="100%" stop-color="#0D2B8A"/>
    </linearGradient>
    <linearGradient id="cresH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/><stop offset="50%" stop-color="#00D2FF"/><stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="starAmbH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/><stop offset="30%" stop-color="#FDE68A"/><stop offset="70%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glowH" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="b1"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Left Icon Emblem (Nexus Style) -->
  <g transform="translate(10, 5)">
    <path d="M 22,46 C 12,70 28,90 52,91 C 74,92 90,80 94,64 C 84,74 70,81 52,81 C 34,81 22,67 26,50 Z" fill="url(#cresH)"/>
    <path d="M 33,85 C 48,91 73,89 86,76" stroke="#F59E0B" stroke-width="1.2" stroke-linecap="round"/>

    <g filter="url(#glowH)">
      <polygon points="20,40 21,37 23,40 20,38 23,38" fill="#D97706" transform="scale(1.2) translate(-2, -6)"/>
      <polygon points="26,30 27,27 29,30 26,28 29,28" fill="#D97706" transform="scale(1.3) translate(-3, -4)"/>
      <polygon points="36,21 37,17 40,21 36,19 40,19" fill="#F59E0B" transform="scale(1.4) translate(-4, -2)"/>
      <polygon points="48,15 49,11 52,15 48,13 52,13" fill="#F59E0B" transform="scale(1.5) translate(-6, 0)"/>
      <g transform="translate(64, 13)">
        <circle cx="0" cy="0" r="3" fill="url(#starAmbH)"/>
        <circle cx="0" cy="0" r="1.2" fill="#FFFFFF"/>
        <line x1="0" y1="-5.5" x2="0" y2="5.5" stroke="#D97706" stroke-width="0.8"/>
        <line x1="-5.5" y1="0" x2="5.5" y2="0" stroke="#D97706" stroke-width="0.8"/>
      </g>
    </g>

    <g transform="translate(52, 48) scale(0.13) rotate(-3)">
      <path d="M -160,-105 L 145,-105 L 120,-55 L -130,-55 Z" fill="url(#wH)"/>
      <polygon points="-160,-105 -130,-55 -145,-55" fill="#0369A1"/>
      <line x1="-155" y1="-103" x2="140" y2="-103" stroke="#FFFFFF" stroke-width="2" opacity="0.8"/>
      <path d="M -125,145 L -70,145 L -10,-45 L -55,-45 Z" fill="#0284C7"/>
      <path d="M -80,45 L 20,45 L 10,75 L -70,75 Z" fill="url(#bH)"/>
      <path d="M -22,-55 L 22,-55 L 22,145 L -22,145 Z" fill="#00D2FF"/>
      <line x1="0" y1="-50" x2="0" y2="140" stroke="#FFFFFF" stroke-width="2.5" opacity="0.7"/>
      <path d="M 0,-55 L 75,-55 C 145,-55 160,15 105,52 C 75,72 25,72 0,72 L 0,30 C 18,30 55,30 75,18 C 105,-2 92,-25 45,-25 L 0,-25 Z" fill="url(#lH)"/>
      <g transform="translate(0, -105)">
        <polygon points="0,-22 16,0 0,22 -16,0" fill="url(#starAmbH)"/>
        <polygon points="0,-12 9,0 0,12 -9,0" fill="#FFFFFF"/>
        <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
      </g>
      <polygon points="0,145 22,145 0,175 -22,145" fill="url(#wH)"/>
    </g>
  </g>

  <!-- Right Wordmark -->
  <g transform="translate(130, 64)">
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="58" font-weight="900" letter-spacing="-1px">
      <tspan fill="#07153B">TP</tspan><tspan fill="#0284C7">AI</tspan>
    </text>
  </g>
  <text x="134" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" letter-spacing="5.5px" fill="#64748B">
    TUAN PHAM AI
  </text>
</svg>